sources:
  rfam_15_1_seed:
    description: Rfam release 15.1 seed alignments in Stockholm format, with the hand-curated consensus
      secondary structure of each family (#=GC SS_cons).
    landing_page: https://rfam.org/
    download_url: https://ftp.ebi.ac.uk/pub/databases/Rfam/15.1/Rfam.seed.gz
    licence: 'CC0 1.0. Release COPYING: ''Rfam is freely available under the Creative Commons Zero ("CC0")
      licence.'''
    licence_source: https://ftp.ebi.ac.uk/pub/databases/Rfam/15.1/COPYING
    citation: 'Ontiveros-Palacios N, et al. Rfam 15: RNA families database in 2025. Nucleic Acids Res
      2025;53:D258-D267. doi:10.1093/nar/gkae1023'
    role: STRUCTURE GENERATING SET for the data-restricted Turner null space (scripts/turner_nullspace_rfam.py).
      Structures are consensus projections onto seed sequences -- comparative, not per-molecule experimental
      -- and are never a training label or a measurement. Substitutes for ArchiveII (BLOCKED item 27);
      it is not ArchiveII.
    files:
    - path: data/raw/structure/Rfam_15.1.seed.gz
      sha256: 41f014f4ab5628620935f089b1bb77987ebc162fda7c72bff368a32c9cccabac
      bytes: 5928432
      route: machine-readable
      origin: https://ftp.ebi.ac.uk/pub/databases/Rfam/15.1/Rfam.seed.gz
      verification: Distributed artifact, no transcription. Size checked against the FTP Content-Length;
        sha256 taken at ingestion (the FTP publishes no checksum).
    retrieved: '2026-10-07'
  mxfold2_datasets:
    description: The datasets of MXfold2 (TrainSetA/B, TestSetA/B, bpRNA-1m TR0/VL0/TS0 canonical-pair
      versions, bpRNA-new, RNAStrAlign) as BPSEQ files with list files, one tarball.
    landing_page: https://doi.org/10.5281/zenodo.4430150
    download_url: https://zenodo.org/records/4430150/files/mxfold2-data.tar.gz?download=1
    licence: CC BY 4.0 (Zenodo record metadata)
    citation: Sato K, Akiyama M, Sakakibara Y. RNA secondary structure prediction using deep learning
      with thermodynamic integration. Nat Commun 2021;12:941. doi:10.1038/s41467-021-21194-4
    role: 'TRAINING AND EVALUATION DATA for the MXfold2 seed study only: TR0 trains, TS0 is the fixed
      evaluation set. The bundled archiveII/ directory is NOT used (BLOCKED item 27).'
    files:
    - path: data/raw/structure/mxfold2-data.tar.gz
      sha256: 8332469e74c0b2be2140a883f92166488c308e87b662c39eebe771002e1ef51c
      bytes: 20360424
      route: machine-readable
      origin: https://zenodo.org/records/4430150/files/mxfold2-data.tar.gz?download=1
      verification: Distributed artifact, no transcription. md5 45a4d51f01517dd782216920ccc510b7 matches
        the Zenodo record.
    retrieved: '2026-10-07'
  rfam_12_2_families:
    description: 'Rfam release 12.2 family table (database_files/family.txt.gz): one row per family, accession
      first.'
    landing_page: https://rfam.org/
    download_url: https://ftp.ebi.ac.uk/pub/databases/Rfam/12.2/database_files/family.txt.gz
    licence: 'CC0 1.0. Release COPYING: ''Rfam is freely available under the Creative Commons Zero ("CC0")
      licence.'''
    licence_source: https://ftp.ebi.ac.uk/pub/databases/Rfam/12.2/COPYING
    citation: 'Nawrocki EP, et al. Rfam 12.0: updates to the RNA families database. Nucleic Acids Res
      2015;43:D130-D137 (release 12.2: rfam.org).'
    role: 'FAMILY LIST ONLY: which Rfam families bpRNA-1m could contain (bpRNA-1m drew ''all families
      from RFAM 12.2'', Danaee 2018, PMC6009582). Used by scripts/typeb_heldout.py to select Rfam 15.1
      families absent from 12.2. No sequence or structure is read.'
    files:
    - path: data/raw/structure/Rfam_12.2.family.txt.gz
      sha256: 8904fb58a8ae13650b0f95703b4105cdc84c2db58a6ef767d8cb572887effd54
      bytes: 233455
      route: machine-readable
      origin: https://ftp.ebi.ac.uk/pub/databases/Rfam/12.2/database_files/family.txt.gz
      verification: Distributed artifact, no transcription. Size checked against the FTP Content-Length;
        sha256 taken at ingestion (the FTP publishes no checksum).
    retrieved: '2026-10-12'
